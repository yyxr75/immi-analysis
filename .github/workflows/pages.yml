name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# GITHUB_TOKEN needs these for the Pages deployment API
permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; queue instead of cancelling a live one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the build before publishing
        run: |
          test -f site/index.html
          test -f site/data/occupations.json
          n=$(ls site/data/*.json | wc -l)
          echo "occupation payloads: $n"
          test "$n" -gt 100

      # Pages must already be enabled with Source = GitHub Actions
      # (Settings -> Pages). The default GITHUB_TOKEN cannot turn it on,
      # so enablement: true here just fails the job.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
