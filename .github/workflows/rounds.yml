name: Official invitation rounds

# Home Affairs posts each 189 / 491 (family) round on the SkillSelect
# "Invitation rounds" page about two weeks after it is held, on no fixed day.
# Check four times a day; when a new round appears, save it, commit (which
# redeploys the site) and open an issue so the owner gets an email.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write
  issues: write
  actions: write   # pushes made with GITHUB_TOKEN do not trigger pages.yml; dispatch it

concurrency:
  group: rounds
  cancel-in-progress: false

jobs:
  rounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and parse the current round
        id: r
        working-directory: scripts
        run: python rounds.py

      - name: Commit
        if: steps.r.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/rounds site/data/rounds.json
          git commit -m "data: official invitation round ${{ steps.r.outputs.round }}"
          git pull --rebase
          git push

      - name: Redeploy the site
        if: steps.r.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Notify
        if: steps.r.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "官方邀请轮次已公布：${{ steps.r.outputs.round }}" \
            --body "Home Affairs 已公布 ${{ steps.r.outputs.round }} 轮的官方结果，已存入 site/data/rounds/。来源：https://immi.homeaffairs.gov.au/visas/working-in-australia/skillselect/invitation-rounds"
