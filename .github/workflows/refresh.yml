name: Refresh data from SkillSelect

# The dashboard reloads monthly; this re-scrapes and commits a new site/.
# Manual by default -- flip the schedule on once you trust it.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 5 * *'   # 05th of each month, 03:00 UTC

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Pull cubes and rebuild the site
        working-directory: scripts
        run: |
          python extract.py
          python extract_all.py
          python extract_thresholds.py
          python build_site.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh SkillSelect data"
          git push
